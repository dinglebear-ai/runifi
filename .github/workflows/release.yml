name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Require synchronized semver
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)" = "$version"
          test "$(node -p 'require("./packages/unifi-rmcp/package.json").version')" = "$version"
          test "$(jq -r .version server.json)" = "$version"
          bash scripts/check-version-sync.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build x86_64 binaries
    needs: validate
    uses: dinglebear-ai/workflows/.github/workflows/hosted-rust-platform-release.yml@eb5f36cf517ffc949aca1c81e2ccbc71b5a85267
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      targets-json: >-
        [{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},
         {"runner":"windows-2025","target":"x86_64-pc-windows-msvc"}]
      build-command: cargo build --release --locked --target "$TARGET" --bin runifi
      package-command: >-
        mkdir -p artifacts package &&
        ext="" &&
        if [[ "$TARGET" == *windows* ]]; then ext=".exe"; fi &&
        cp "target/$TARGET/release/runifi$ext" "package/runifi$ext" &&
        tar -C package -czf "artifacts/runifi-$TARGET.tar.gz" "runifi$ext" &&
        sha256sum "artifacts/runifi-$TARGET.tar.gz" >
        "artifacts/runifi-$TARGET.tar.gz.sha256"
      artifact-path: artifacts/*
      artifact-prefix: runifi

  github-release:
    name: Publish GitHub release assets
    needs: [validate, binaries]
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: dinglebear-ai/workflows/.github/workflows/github-release.yml@eb5f36cf517ffc949aca1c81e2ccbc71b5a85267
    with:
      release-tag: ${{ github.event.release.tag_name }}
      artifact-pattern: runifi-*

  npm:
    name: Publish npm launcher
    needs: [validate, github-release]
    permissions:
      contents: read
      id-token: write
    uses: dinglebear-ai/workflows/.github/workflows/npm-trusted-publish.yml@eb5f36cf517ffc949aca1c81e2ccbc71b5a85267
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      expected-version: ${{ needs.validate.outputs.version }}
      working-directory: packages/unifi-rmcp
      cache-dependency-path: packages/unifi-rmcp/package.json
      enable-cache: false
      install-command: "true"
      verify-command: npm test && npm run check
