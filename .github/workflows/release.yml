name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to attach assets to, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  # REQUIRED under a compile wrapper (kache).
  CARGO_INCREMENTAL: "0"
  # Persistent per-runner zccache compile store (replaces the old sccache dir).

jobs:
  release-meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
            release_name="${{ github.event.release.name }}"
          else
            tag="${{ inputs.tag_name }}"
            if [[ -z "$tag" ]]; then
              echo "::error::tag_name is required for manual releases"
              exit 1
            fi
            release_name="unifi-rmcp ${tag}"
          fi
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"

  build:
    needs: release-meta
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: runifi-linux-x86_64
            archive: runifi-x86_64.tar.gz
            ext: ""
          - target: x86_64-pc-windows-msvc
            artifact: runifi-windows-x86_64.exe
            archive: runifi-windows-x86_64.tar.gz
            ext: ".exe"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.tag_name }}

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          targets: ${{ matrix.target }}
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-prefix: ${{ vars.KACHE_S3_PREFIX }}

      - name: Install cross toolchain
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm llvm clang lld
          cargo install cargo-xwin --locked

      - name: Build web assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f apps/web/package.json ]]; then
            cd apps/web
            npm install -g "$(node -p "require('./package.json').packageManager")"
            pnpm install --frozen-lockfile
            pnpm build
          fi

      - name: Build (linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --locked --target ${{ matrix.target }} --bin runifi

      - name: Build (windows cross)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo xwin build --release --locked --target ${{ matrix.target }} --bin runifi

      - name: Stage artifact + checksum
        run: |
          cp "target/${{ matrix.target }}/release/runifi${{ matrix.ext }}" "${{ matrix.artifact }}"
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          mkdir -p archive
          cp "${{ matrix.artifact }}" "archive/runifi${{ matrix.ext }}"
          tar -C archive -czf "${{ matrix.archive }}" "runifi${{ matrix.ext }}"
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ matrix.artifact }}

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  publish-release:
    needs: [release-meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist/release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag_name }}
          name: ${{ needs.release-meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          files: dist/release-assets/*

  npm:
    needs: [release-meta, publish-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate npm publication identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami >/dev/null

      - name: Verify npm package version matches release tag
        id: npm-version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.release-meta.outputs.tag_name }}"
          version="$(node -p "require('./packages/unifi-rmcp/package.json').version")"
          if [[ "$tag" != "v${version}" ]]; then
            echo "::error::release tag ${tag} does not match packages/unifi-rmcp/package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Test npm launcher
        run: npm test --prefix packages/unifi-rmcp
      - name: Check npm launcher syntax
        run: npm run check --prefix packages/unifi-rmcp
      - name: Dry-run npm package
        run: npm pack --dry-run --json ./packages/unifi-rmcp

      - name: Check whether npm version is already published
        id: published
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@dinglebear/runifi@${{ steps.npm-version.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package
        if: steps.published.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public ./packages/unifi-rmcp

      - name: Smoke published npm launcher
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.npm-version.outputs.version }}"
          for attempt in {1..12}; do
            if npm view "@dinglebear/runifi@${version}" version >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::@dinglebear/runifi@${version} is not visible in the npm registry"
              exit 1
            fi
            sleep 5
          done
          cache="$(mktemp -d)"
          trap 'rm -rf "$cache"' EXIT
          npm_config_cache="$cache" npx -y "@dinglebear/runifi@${version}" --version
