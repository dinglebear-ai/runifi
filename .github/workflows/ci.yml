name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # REQUIRED under a compile wrapper (soldr/zccache).
  CARGO_INCREMENTAL: "0"
  # Persistent per-runner zccache compile store (replaces the old sccache dir).
  SOLDR_CACHE_DIR: ${{ github.workspace }}/../.soldr-cache

jobs:
  fmt:
    name: Formatting
    runs-on: [self-hosted, unraid]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + soldr
        uses: ./.github/actions/setup-rust-soldr
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: [self-hosted, unraid]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + soldr
        uses: ./.github/actions/setup-rust-soldr
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy -- -D warnings

  test:
    name: Tests
    runs-on: [self-hosted, unraid]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + soldr
        uses: ./.github/actions/setup-rust-soldr
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run --profile ci
      - name: Validate internal reference
        run: cargo run -p xtask -- validate-internal-reference
      - name: Verify API endpoint contracts
        run: cargo run -p xtask -- verify-api-endpoints --mode contract
      - name: Check repository guardrails
        run: cargo run -p xtask -- check-forbidden-strings

  toml:
    name: TOML Format
    runs-on: [self-hosted, unraid]
    steps:
      - uses: actions/checkout@v4

      # Fails when Cargo.toml, package.json and server.json disagree on the
      # version. The previous 87-line variant here never read server.json, so
      # it reported OK while a sibling repo sat a release out of sync.
      - name: Check version sync
        run: bash scripts/check-version-sync.sh
      # Same gap as the audit job: no toolchain on the unraid self-hosted
      # image, so `cargo install` died with "cargo: command not found".
      - name: Install Rust + soldr
        uses: ./.github/actions/setup-rust-soldr
      - name: Install taplo
        run: cargo install taplo-cli --locked
      - name: Check TOML formatting
        run: taplo check

  audit:
    name: Security Audit
    runs-on: [self-hosted, unraid]
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      # rustsec/audit-check shells out to cargo. The unraid self-hosted image
      # has no toolchain on PATH, so without this the job dies with
      # "Unable to locate executable file: cargo". Every other job here already
      # installs the toolchain this way.
      - name: Install Rust + soldr
        uses: ./.github/actions/setup-rust-soldr
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: npm launcher
    runs-on: [self-hosted, unraid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test npm launcher
        run: npm test --prefix packages/unifi-rmcp
      - name: Check npm launcher syntax
        run: npm run check --prefix packages/unifi-rmcp
      - name: Dry-run npm package
        run: npm pack --dry-run --json ./packages/unifi-rmcp
