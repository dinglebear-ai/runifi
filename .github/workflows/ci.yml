name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust
    uses: dinglebear-ai/workflows/.github/workflows/fast-rust.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      kache-manifest-key: runifi-fast-rust
      test-command: >-
        cargo test --workspace --locked &&
        cargo run -p xtask -- validate-internal-reference &&
        cargo run -p xtask -- verify-api-endpoints --mode contract &&
        cargo run -p xtask -- check-forbidden-strings
    secrets:
      KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
      KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}

  npm:
    name: npm launcher
    uses: dinglebear-ai/workflows/.github/workflows/fast-node.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      working-directory: packages/unifi-rmcp
      cache-dependency-path: packages/unifi-rmcp/package.json
      enable-cache: false
      install-command: "true"
      audit-command: ""
      lint-command: ""
      typecheck-command: ""
      test-command: npm test
      contract-command: >-
        npm run check &&
        npm pack --dry-run --json &&
        cd ../.. &&
        npx --yes @taplo/cli@0.7.0 lint

  repository:
    name: Repository policy
    uses: dinglebear-ai/workflows/.github/workflows/fast-ops.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      shell-globs: "entrypoint.sh scripts/*.sh"
      policy-command: bash scripts/check-version-sync.sh

  security:
    name: Rust security
    uses: dinglebear-ai/workflows/.github/workflows/rust-security.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      cargo-deny-version: "0.20.2"

  contract:
    name: Fleet contract
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      profile: rust
      implementation-ref: 542ea7b7e5ca2d4e21f3277bfcf158584fee90ec

  workflow-policy:
    name: Fleet policy
    uses: dinglebear-ai/workflows/.github/workflows/fleet-policy.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      release-file-regex: '(^|/)([^/]*-)?(release|publish|deploy)[^/]*\.ya?ml$'

  ci-gate:
    name: CI Gate
    if: always()
    needs: [rust, npm, repository, security, contract, workflow-policy]
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 5
    steps:
      - name: Require every CI lane
        env:
          RUST: ${{ needs.rust.result }}
          NPM: ${{ needs.npm.result }}
          REPOSITORY: ${{ needs.repository.result }}
          SECURITY: ${{ needs.security.result }}
          CONTRACT: ${{ needs.contract.result }}
          WORKFLOW_POLICY: ${{ needs.workflow-policy.result }}
        run: |
          test "$RUST" = success
          test "$NPM" = success
          test "$REPOSITORY" = success
          test "$SECURITY" = success
          test "$CONTRACT" = success
          test "$WORKFLOW_POLICY" = success
