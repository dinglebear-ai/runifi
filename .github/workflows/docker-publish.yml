name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z release tag to rebuild and republish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: container-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dinglebear-ai/runifi

jobs:
  container:
    name: Build, scan, attest, and publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: dinglebear-ai/workflows/.github/workflows/hosted-container-release.yml@d7bbe71ddc1157e32ed0bebf928fc07438ba58b0
    with:
      checkout-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
      image: ghcr.io/dinglebear-ai/runifi
      release-tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
      dockerfile: config/Dockerfile
      smoke-command: docker run --rm -e UNIFI_URL=https://unifi.invalid -e UNIFI_API_KEY=release-smoke "$IMAGE_REF" --version
      cache-scope: runifi-release
      timeout-minutes: 60
    secrets:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  promote-tags:
    name: Promote release aliases
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the verified digest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::release tag must be vMAJOR.MINOR.PATCH"
            exit 1
          }
          minor="${version%.*}"
          major="${version%%.*}"
          image="${REGISTRY}/${IMAGE_NAME}"
          digest="$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          short_sha="${GITHUB_SHA:0:7}"
          for tag in "$version" "$minor" "$major" latest "sha-${short_sha}"; do
            docker buildx imagetools create --tag "${image}:${tag}" "${image}@${digest}"
          done

  mcp-registry:
    name: Publish MCP Registry
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
      MCP_REGISTRY_DOMAIN: ${{ vars.MCP_REGISTRY_DOMAIN }}
    steps:
      - name: Checkout released source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
          persist-credentials: false
      - name: Verify registry manifest version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$(jq -r .version server.json)" = "$version"
      - name: Install checksum-pinned MCP publisher v1.8.0
        if: env.MCP_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --silent --show-error --location \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/${archive}" \
            --output "$archive"
          printf '%s  %s\n' \
            1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf \
            "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" mcp-publisher
          test "$(./mcp-publisher --version 2>&1 | grep -o '1\.8\.0' | head -n1)" = "1.8.0"
      - name: Authenticate to MCP Registry
        if: env.MCP_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          test "$MCP_REGISTRY_DOMAIN" = dinglebear.ai
          ./mcp-publisher login dns --domain "$MCP_REGISTRY_DOMAIN" --private-key "$MCP_PRIVATE_KEY"
      - name: Publish to MCP Registry
        if: env.MCP_PRIVATE_KEY != ''
        run: ./mcp-publisher publish
      - name: Skip MCP Registry publish
        if: env.MCP_PRIVATE_KEY == ''
        run: echo "::notice::MCP_PRIVATE_KEY is not configured; skipping MCP Registry publish"
