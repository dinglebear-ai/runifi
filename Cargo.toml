[workspace]
members = [".", "crates/unifi", "xtask"]
resolver = "2"

[workspace.package]
version = "0.2.5"
edition = "2024"
rust-version = "1.97.1"
authors = ["dinglebear.ai <hello@dinglebear.ai>"]
license = "MIT"
readme = "README.md"
homepage = "https://runifi.dinglebear.ai"
repository = "https://github.com/dinglebear-ai/runifi"
description = "MCP server and CLI for UniFi Network controllers: clients, devices, WLANs, firewall, and health over stdio or streamable HTTP, with auth."

[workspace.dependencies]
anyhow = "1"
rmcp = { version = "=3.0.0-beta.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
unifi = { path = "crates/unifi" }

[workspace.lints.clippy]
missing_safety_doc = "deny"
mod_module_files = "deny"

[workspace.lints.rust]
missing_crate_level_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"
invalid_html_tags = "deny"

[package]
name = "unifi-rmcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
categories = ["command-line-utilities", "api-bindings", "network-programming", "development-tools"]
keywords = ["mcp", "unifi", "ubiquiti", "networking", "rmcp"]
description.workspace = true
autobins = false

[[bin]]
name = "runifi"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP / MCP transport
axum = "0.8"
rmcp = { workspace = true, features = [
  "server",
  "macros",
  "transport-streamable-http-server",
  "transport-io",
] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
toml = "0.8"

# OAuth + JWT
lab-auth = { git = "https://github.com/dinglebear-ai/labby.git", rev = "87cec3241f9baef22335de9cc8629ebbcd8ba047", package = "lab-auth" }
url = "2"

# Logging
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "cookies",
] }

# Errors
anyhow.workspace = true

# Paths
dirs = "5"
dotenvy = "0.15.7"
unifi.workspace = true

[features]
test-support = []

[dev-dependencies]
unifi-rmcp = { path = ".", features = ["test-support"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
rmcp = { workspace = true, features = [
  "client",
  "transport-child-process",
] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
